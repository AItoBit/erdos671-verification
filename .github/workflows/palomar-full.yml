name: Palomar full mechanical preflight
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public licensed source repository in owner/name form
        required: true
        type: string
      commit:
        description: Exact 40-character source commit
        required: true
        type: string
      options:
        description: Optional project, metadata and Comparator paths as JSON
        default: '{"comparator_config_path":"comparator.json"}'
        required: true
        type: string
permissions:
  contents: read
jobs:
  mechanical:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ inputs.repository }}
      commit: ${{ inputs.commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: erdos671-${{ github.run_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: ${{ inputs.options }}
